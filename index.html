<!DOCTYPE html>
<html lang="zh">
<head><meta name="color-scheme" content="only light"><meta name="supported-color-schemes" content="light"><meta name="darkreader-lock">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Daily Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: premium banking app, confident and calm; numbers are the hero
   IDEA: a wallet of bank cards laid above a cashier's ledger
   PICTURE: each bank as a real-looking debit card with its live balance, over a crisp colour-tabbed sheet
   COLOUR and TYPE: deep navy band, each bank's own card colour, white sheet; Plus Jakarta Sans tabular numbers
   LAYOUT: navy hero with cards, floating toolbar, full-height sheet */
:root{color-scheme:light;--bg:light-dark(#eef1f6,#0a0d14);--pan:light-dark(#fff,#141924);--ink:light-dark(#121826,#e8ecf3);--mut:light-dark(#6b7385,#8f99ab);--line:light-dark(#eaedf2,#222938);--line2:light-dark(#d5dae3,#2e3647);--acc:#3d6bff;--hd:light-dark(#f6f8fb,#191f2c);--mix:15%;--navy:#0b1433}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
html{touch-action:pan-x pan-y}html body #app #wrap{touch-action:pan-x pan-y}
.pc{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:999px;font-size:10px;font-weight:800;background:#e0f2fe;color:#0369a1;vertical-align:1px;line-height:15px}.pc.go{background:#f59e0b;color:#fff;cursor:pointer;box-shadow:0 0 0 2px #f59e0b44}.pc.ok{background:#16a34a;color:#fff;cursor:pointer}

html body #app .hero .top{flex-wrap:wrap!important;row-gap:8px!important}
html body #app .hero .top>*{flex:none!important}html body #app .hero .top .btn,html body #app .hero .top .st{white-space:nowrap!important}
html body #app .hero .top #date{min-width:148px!important;width:148px!important}
@media(max-width:1500px){html body #app .hero .top{gap:6px!important}html body #app .hero .top .btn{padding-left:10px!important;padding-right:10px!important}html body #app .hero .top .sp{flex:1 1 0!important;min-width:0!important}html body #app .hero .top #save kbd{display:none!important}}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans","Noto Sans SC",system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow-x:hidden}
#app{display:flex;flex-direction:column;min-height:100vh}
button,input{font:inherit;color:inherit}[hidden]{display:none!important}
body[data-role=cs] #tng input{pointer-events:none}
#tng .tv,.kp div:has(>#t-all){display:none!important}body .menu:has([data-tpick]){max-height:none!important;overflow:visible!important}body .menu:has([data-tpick]) div{padding:5px 10px!important;font-size:13px!important}body .tot.kpi{border-color:#38bdf866!important;box-shadow:inset 0 2px 0 #38bdf8,0 6px 18px -12px #38bdf8!important}body .kg span,body .kp.kb .lb{color:#7dd3fc!important}body .rl{color:#7dd3fc!important}body .bar .btn,body .top .btn,body .dnav .btn,body .top .fld{border-color:#38bdf866!important}body .bar .btn:hover,body .top .btn:hover{border-color:#38bdf8!important}body td.act{box-shadow:inset 0 0 0 2px #38bdf8!important}body td.in.act{box-shadow:inset 0 0 0 2px #38bdf8,inset 0 0 0 9999px #38bdf826!important}body td.in{background-color:#38bdf81f}body #th tr.hh th:not(.bk){box-shadow:inset 0 -2px 0 #38bdf8;color:#bae6fd}body .tabs .tb.on{box-shadow:0 0 0 2px #38bdf8,0 2px 8px #0005!important}#tng .tw .c1{justify-content:center}body #tng .tw{height:34px;background:linear-gradient(120deg,#0ea5e966,#38bdf82e 55%,#38bdf812)!important;border:1px solid #7dd3fcb3!important;box-shadow:inset 3px 0 0 #7dd3fc,0 0 12px -4px #38bdf8!important;border-radius:9px;padding:0 6px 0 9px!important;gap:4px!important}body #tng .tw:hover{border-color:#38bdf8aa!important;filter:none}.rl:has(+#tng){font-size:0!important}.rl:has(+#tng)::before{content:"TNG";display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:.04em;padding:3px 6px;border-radius:5px;background:#0b5bd3;color:#ffd400}body #tng .tw .c2{gap:4px!important;padding-left:0!important}body #tng .tw .lim b{background:#38bdf8!important;color:#062a4d!important;padding:1px 6px!important;font-size:12px!important}body #tng .tw .c2>span{display:inline!important;font-size:10px!important;font-weight:700!important;color:#bae6fd!important}body #tng .tw .c2{flex-direction:row!important;align-items:center!important}body #tng .tw input.tn{font-size:12.5px!important;color:#ffffff!important;font-weight:700!important}
.hero{transition:none;background:radial-gradient(1200px 300px at 85% -40%,#2b4cff55,transparent),radial-gradient(800px 260px at 0% 120%,#7b5ccc44,transparent),var(--navy);color:#fff;padding:12px 20px 58px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#f2c200,#f07b22 45%,#d62f3f);display:grid;place-items:center;font-size:15px;color:#fff}
.top .sp{flex:1}
.top .fld{background:#ffffff14;border-color:#ffffff2a;color:#fff;color-scheme:dark}
.st{font-size:13px;color:#c9d2ea;display:flex;align-items:center;gap:7px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 4px #3ddc8430}.st.dirty i{background:#ffb020;box-shadow:0 0 0 4px #ffb02030}
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--pan);cursor:pointer;font-weight:700;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:transform .12s,background .12s}
.btn svg{width:16px;height:16px;flex:none}
.btn:hover{background:var(--hd)}.btn:active{transform:translateY(1px)}.btn:focus-visible,.fld:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:#fff;border-color:#fff;color:var(--navy)}.btn.pri:hover{background:#e8edff}
.btn.pri kbd{background:#0b143312;border-color:#0b143322;color:var(--navy)}
.btn.go{background:var(--acc);border-color:var(--acc);color:#fff}
.fld{height:38px;border:1px solid var(--line2);border-radius:10px;background:var(--pan);padding:0 10px;font-size:16px}
.tot{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;margin:10px 0 10px}
.tot .lb{font-size:12px;color:#aab6d6;font-weight:600}
.tot .big{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.tot .sm{font-size:16px;font-weight:700}.tot .up{color:#5ff0a0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.card{position:relative;overflow:hidden;border-radius:12px;padding:8px 10px;color:var(--ci,#fff);background:linear-gradient(140deg,color-mix(in oklab,var(--c) 92%,#fff),color-mix(in oklab,var(--c) 72%,#000));box-shadow:0 8px 18px -10px color-mix(in oklab,var(--c) 70%,#000),inset 0 1px 0 #ffffff40}
.card::before{content:"";position:absolute;border-radius:50%;background:#ffffff1c;width:90px;height:90px;right:-34px;top:-44px;pointer-events:none}
.card b{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:800;position:relative}
.card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .td{font-size:11.5px;font-weight:700;opacity:.85;margin:-2px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.card .big{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;margin:1px 0 5px}
.card .row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;opacity:.9;gap:4px;position:relative;font-weight:600}
.card input{width:78px;border:1px solid transparent;border-radius:6px;background:#00000018;text-align:right;padding:0 5px;font-size:11.5px;font-weight:700;color:inherit}
.card input:hover,.card input:focus{border-color:#ffffff70;outline:0;background:#00000030}
.glb{margin:12px 0 6px;font-size:12px;color:#aab6d6;font-weight:700}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.gc{background:#ffffff0d;border:1px solid #ffffff1f;border-radius:12px;padding:8px 10px}
.gc .nm{display:block;font-weight:800;font-size:12.5px;line-height:1.2;flex:1;overflow:hidden;white-space:nowrap}
.gc .nm span{display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis}
.gc .nm i{width:8px;height:8px;border-radius:50%;flex:none;background:hsl(var(--h) 80% 60%)}
.gc .nm small{font-size:11px;font-weight:700;color:#8f9bbb}
.gc .up{color:#5ff0a0!important}.gc .dn{color:#ff8a8a!important}
.gc .gs{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:11.5px;color:#aab6d6;font-weight:600}
.gc .gs input{width:78px;border:1px solid transparent;border-radius:6px;background:#00000028;color:#fff;font-size:11.5px;font-weight:700;padding:0 5px;text-align:right}
.gc .gs input:hover,.gc .gs input:focus{border-color:#ffffff60;outline:0}
.gc .gv{margin:1px 0 5px}.gc .gv b{display:block;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gc .gv small{font-size:11px;font-weight:700;color:#8f9bbb}
.gc .now{width:92px;flex:none;border:1px solid transparent;border-radius:7px;background:#00000028;color:#fff;font-size:14px;font-weight:800;padding:4px 7px;text-align:right}
.gc .now:hover,.gc .now:focus{border-color:#ffffff60;outline:0}
.hero.mini .cards,.hero.mini .glb,.hero.mini .gcards{display:none}
.dnav{display:inline-flex;gap:4px;align-items:center}.dnav .btn.off{opacity:.35}.dnav .btn{width:38px;justify-content:center;padding:0;font-size:20px}
.tg{background:#ffffff14;border-color:#ffffff2a;color:#fff}.tg:hover{background:#ffffff24}
.main{flex:1;display:flex;flex-direction:column;margin:-44px 20px 0;min-height:0;position:relative}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;background:var(--pan);border:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px -12px #0b143340}
.rows{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px 10px;align-items:center}
.rl{font-size:12px;font-weight:700;color:#aab6d6}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}#tng{display:flex;flex-wrap:wrap}#tng .ch{flex:1 1 128px}#tng .ch.add{flex:0 0 34px;padding:0;font-size:18px}
.ch{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;height:34px;padding:0 9px;border-radius:9px;background:#ffffff0f;border:1px solid #ffffff1c;font-size:12.5px;font-weight:700;color:#c9d2ea;white-space:nowrap;overflow:hidden}
.ch b{flex:none;font-size:13.5px;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis}
.ch.bk{background:var(--c);border-color:transparent;color:var(--ci,#fff)}.ch.bk b{color:var(--ci,#fff)}.ch.bk span{opacity:.9}
.ch .nmx{display:block;overflow:hidden;text-overflow:ellipsis;font-size:12px}.ch .nmx i{display:inline-block;margin-right:5px;vertical-align:1px}
.ch i{width:7px;height:7px;border-radius:50%;flex:none;background:hsl(var(--h) 80% 60%)}
.ch input{border:1px solid transparent;border-radius:6px;background:transparent;color:inherit;font:inherit;padding:1px 4px;min-width:0}
.ch input.tn{width:auto;flex:1;margin-left:-5px;color:#c9d2ea}.ch input.tv{flex:none;width:62px;padding-right:5px;text-align:right;font-size:13.5px;font-weight:800;color:#fff;background:transparent}
.ch input:hover,.ch input:focus{border-color:#ffffff60;outline:0}
.ch .x{position:absolute;left:0;top:0;bottom:0;width:16px;border:0;background:#d62f3f;color:#fff;font-size:12px;cursor:pointer;opacity:0;padding:0}
.ch:hover .x,.ch .x:focus{opacity:1}
.ch.t2{flex-direction:column;align-items:stretch;justify-content:center;height:auto;padding:4px 9px 5px;gap:1px}
.ch .r1{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ch .lim{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;color:#8f9bbb;white-space:nowrap;padding:0 5px 0 0}
.ch .lim b{font-size:12px;font-weight:800}.ch .lim b.ok{color:#5ff0a0}.ch .lim b.lo{color:#ffc24d}.ch .lim b.no{color:#ff8a8a}.ch .lim span{color:#aab6d6}
#tng .ch{flex:1 1 128px}#tng .ch.add{height:auto;min-height:48px}
.ch.add{justify-content:center;border-style:dashed;cursor:pointer;color:#aab6d6}.ch.add:hover{color:#fff;background:#ffffff18}
.hero.mini .rows{display:none}
.seg{display:inline-flex;background:#ffffff12;border:1px solid #ffffff1f;border-radius:10px;padding:3px;margin:0 0 0 auto;gap:2px}
.seg button{border:0;background:none;color:#aab6d6;font-weight:700;font-size:13px;padding:6px 16px;border-radius:7px;cursor:pointer}
.seg button:hover{color:#fff}.seg button.on{background:#fff;color:var(--navy)}
.hero[data-tab=b] #gcards,.hero[data-tab=b] #tng,.hero[data-tab=g] #cards,.hero[data-tab=g] #tng,.hero[data-tab=t] #cards,.hero[data-tab=t] #gcards{display:none}
.hero.mini .seg{display:none}
.tc{position:relative;background:#ffffff0d;border:1px solid #ffffff1f;border-radius:12px;padding:7px 10px 8px}
.tc .tn{display:block;width:calc(100% - 18px);border:1px solid transparent;border-radius:6px;background:transparent;color:#fff;font-size:12.5px;font-weight:800;padding:0 4px;margin-left:-5px}
.tc .tv{display:block;width:100%;border:1px solid transparent;border-radius:7px;background:#00000028;color:#fff;font-size:16px;font-weight:800;padding:2px 6px;margin-top:4px;text-align:right}
.tc input:hover,.tc input:focus{border-color:#ffffff60;outline:0}
.tc .x{position:absolute;top:5px;right:6px;border:0;background:none;color:#8f9bbb;font-size:15px;cursor:pointer;opacity:0;width:20px;height:20px;border-radius:5px}
.tc:hover .x,.tc .x:focus{opacity:1}.tc .x:hover{background:#ffffff1a;color:#fff}
.tc.add{border-style:dashed;color:#aab6d6;font-weight:700;font-size:13px;cursor:pointer;min-height:62px;display:grid;place-items:center}.tc.add:hover{background:#ffffff14;color:#fff}
.search{position:relative;flex:1;max-width:280px;min-width:170px}.search input{padding-left:34px;width:100%;background:var(--hd);border-color:transparent}
.search svg{position:absolute;left:11px;top:11px;color:var(--mut)}
.bar .gap{flex:1}
.wrap{flex:none;height:calc(100vh - 170px);min-height:380px;overflow:auto;background:var(--pan);border:1px solid var(--line);border-top:0;position:relative;outline:0}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;user-select:none}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:34px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
thead th{position:sticky;top:0;z-index:3;background:var(--pan);font-weight:800;font-size:12.5px;color:var(--mut);text-align:left;height:40px;border-bottom:1px solid var(--line2)}
thead th.bk{background:var(--c);color:var(--ci,#fff);text-align:center;border-bottom:0;border-right-color:#ffffff40;font-size:13px}
tfoot td{position:sticky;bottom:0;z-index:3;background:var(--hd);font-weight:800;border-top:2px solid var(--line2);height:40px}
tfoot td.bk{color:color-mix(in oklab,var(--c) 75%,var(--ink))}
td.bk{background:color-mix(in oklab,var(--c) var(--mix),var(--pan))}
tbody tr:nth-child(even) td:not(.bk):not(.rh){background:color-mix(in oklab,var(--hd) 60%,var(--pan))}
tbody tr:hover td{filter:brightness(.98)}
td.n{text-align:right;font-weight:600}
td.bad{color:#d62f3f}
td.neg{color:light-dark(#c62828,#ff8a8a)}td.pos{color:light-dark(#1b7a3d,#6ee7a0)}
tbody tr:nth-child(even) td.bk{background:color-mix(in oklab,var(--c) calc(var(--mix) + 5%),var(--pan))}
td.xt{background:light-dark(#f4f6fa,#181d28)!important}
td.xt.pos{color:var(--ink)}
td.gm{color:light-dark(#3d3a8c,#b9b5ff);font-weight:700}
td.tn{color:light-dark(#0b7a75,#5fe0d6);font-weight:700}
tbody tr:hover td{filter:none}tbody tr:hover td:not(.rh):not(.in):not(.act){box-shadow:inset 0 9999px 0 light-dark(#3d6bff0a,#ffffff08)}
.rh{position:sticky;left:0;z-index:2;background:var(--hd)!important;color:var(--mut);text-align:center;font-size:12px;cursor:pointer;padding:0;font-weight:600}
thead .rh,tfoot .rh{z-index:4}
td{position:relative;cursor:cell}
td.in{background-image:linear-gradient(#3d6bff22,#3d6bff22)}
td.act{box-shadow:inset 0 0 0 2px var(--acc);border-radius:3px}
tr.hit .rh{background:#3d6bff26!important;color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:7px;font-size:12.5px;font-weight:800;background:hsl(var(--h) 80% 55%/.14);color:light-dark(hsl(var(--h) 65% 34%),hsl(var(--h) 85% 76%))}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:hsl(var(--h) 75% 52%)}
.dd{position:absolute;right:6px;top:9px;width:16px;height:16px;color:var(--mut);cursor:pointer;opacity:.6}
td:hover .dd{opacity:1}
.ed{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0 9px;font-size:14px;background:var(--pan);box-shadow:inset 0 0 0 2px var(--acc),0 4px 16px #3d6bff40;outline:0;z-index:5;border-radius:3px;font-weight:600}
.ed.n{text-align:right}
td[data-c="3"] .ed{text-transform:uppercase}
.menu{position:fixed;z-index:20;background:var(--pan);border:1px solid var(--line2);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.22);padding:5px;min-width:160px;max-height:260px;overflow:auto}
.menu div{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700}
.menu .mh{margin:4px 8px 4px;font-size:12px;color:var(--mut);font-weight:700}
.menu div{display:flex;justify-content:space-between;gap:14px}.menu div small{color:var(--mut);font-weight:600}
.menu div.on,.menu div:hover{background:#3d6bff1f;color:var(--acc)}
.foot{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);padding:8px 12px;background:var(--pan);border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;margin-bottom:14px;font-weight:600}
kbd{font:700 11px "Plus Jakarta Sans",sans-serif;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--hd)}
.foot .sp{flex:1}
.mask{position:fixed;inset:0;background:rgba(6,10,24,.55);backdrop-filter:blur(3px);display:none;place-items:center;z-index:50;padding:16px}
.mask.on{display:grid}
.dlg{background:var(--pan);border-radius:18px;padding:24px;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.dlg h3{margin:0 0 8px;font-size:20px}.dlg p{margin:0 0 20px;color:var(--mut)}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end}
.dlg.wide{max-width:820px;width:100%}
.ncols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-bottom:8px;max-height:60vh;overflow:auto}
.dlg h4{margin:0 0 8px;font-size:13px;color:var(--mut)}
.nr{display:flex;gap:6px;align-items:center;margin-bottom:6px}.nr .fld.st{flex:none;width:110px;text-align:right;text-transform:none;color:var(--ink)}.nr .fld{text-transform:uppercase;flex:1;height:36px;font-size:15px;background:var(--hd)}
.nr input[type=color]{width:36px;height:36px;border:0;padding:0;background:none;border-radius:8px;cursor:pointer;flex:none}
.nr i{width:10px;height:10px;border-radius:50%;background:hsl(var(--h) 75% 52%);margin:0 13px;flex:none}
.nr .x{width:32px;height:32px;border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer;border-radius:8px;flex:none}.nr .x:hover{background:var(--hd)}
.btn.sm{height:32px;font-size:13px}.note{color:#d62f3f!important;min-height:1em;margin:8px 0 12px!important;font-size:13px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;box-shadow:0 10px 30px #0b143360}
.toast.on{opacity:1;transform:translate(-50%,0)}

async function resolveDay(k){
  const {data:row,error}=await SB.from('days').select('version,data').eq('day',k).maybeSingle();if(error)throw error;
  if(!row){const r=await SB.from('days').insert({day:k,data:S.days[k]}).select('version,data').single();if(r.error)throw r.error;VER[k]=r.data.version;SNAP[k]=canon(r.data.data);BASE[k]=r.data.data;return}
  const base=BASE[k]||{rows:[]},loc=S.days[k],rem=row.data,key=r=>canon(r);
  const bs=new Set((base.rows||[]).map(key)),ls=new Set((loc.rows||[]).map(key)),rs=new Set((rem.rows||[]).map(key));
  const gone=new Set([...bs].filter(x=>!ls.has(x)));
  const rows=(rem.rows||[]).filter(r=>!gone.has(key(r)));
  (loc.rows||[]).forEach(r=>{if(!bs.has(key(r))&&!rs.has(key(r)))rows.push(r)});
  const pick=f=>canon(loc[f]||null)!==canon(base[f]||null)?loc[f]:rem[f];
  const merged={rows,open:pick('open')||{},games:pick('games')||{},adds:pick('adds')||[]};if(loc.keep||rem.keep)merged.keep=true;
  const u=await SB.from('days').update({data:merged}).eq('day',k).eq('version',row.version).select('version,data');
  if(u.error)throw u.error;if(!u.data||!u.data.length)throw new Error('conflict');
  VER[k]=u.data[0].version;SNAP[k]=canon(u.data[0].data);BASE[k]=u.data[0].data;S.days[k]=merged;delete PEND[k];
  if(k===S.date){loadDayInto(merged)}refreshViews();toast('Merged with changes from another person')}
async function doSync(){
  stash();let reload=false;
  for(const k of Object.keys(S.days)){
    const js=canon(S.days[k]);if(SNAP[k]===js)continue;
    if(VER[k]==null){
      const r=await SB.from('days').insert({day:k,data:S.days[k]}).select('version,data').single();
      if(r.error){if(r.error.code==='23505'){await resolveDay(k)}else throw r.error}
      else{VER[k]=r.data.version;SNAP[k]=canon(r.data.data);BASE[k]=r.data.data}
    }else{
      const r=await SB.from('days').update({data:S.days[k]}).eq('day',k).eq('version',VER[k]).select('version,data');
      if(r.error)throw r.error;
      if(!r.data||!r.data.length)await resolveDay(k);else{VER[k]=r.data[0].version;SNAP[k]=canon(r.data[0].data);BASE[k]=r.data[0].data}
    }
  }
  for(const k of Object.keys(SNAP)){if(k in S.days)continue;
    const r=await SB.from('days').delete().eq('day',k).select('day');if(r.error)throw r.error;
    if(r.data&&r.data.length){delete SNAP[k];delete VER[k];delete BASE[k]}else{reload=true}}
  const sj=canon(settingsOf());
  if(sj!==SSNAP){const r=await SB.from('settings').upsert({id:1,data:settingsOf(),updated_at:new Date().toISOString()});if(r.error)throw r.error;SSNAP=sj}
  if(reload){toast('Only the admin can delete a sheet');setTimeout(()=>location.reload(),1200)}
}

  if(editing)o+='<div class="hrow"><input class="n" data-i="'+i+'" placeholder="按钮名称 '+(i+1)+'" value="'+ESC(x.n)+'" maxlength="40"><input class="u" data-i="'+i+'" placeholder="https://链接" value="'+ESC(x.u)+'" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"></div>';
  else{const has=x.n||x.u,url=norm(x.u);
   if(has)o+='<a class="hbtn" '+(url?'href="'+ESC(url)+'" target="_blank" rel="noopener noreferrer"':'')+'><span class="ic">'+svg('link')+'</span><span class="tx">'+ESC(x.n||x.u)+'</span>'+svg('ch','hch')+'</a>';
   else o+='<button class="hbtn empty" data-edit="1"><span class="ic">'+svg('plus')+'</span><span class="tx">添加链接 '+(i+1)+'</span></button>'}});
 o+='<button class="hedit'+(editing?' on':'')+'" id="h-ed">'+(editing?'完成':'编辑')+'</button>';
 o+='<button class="hout" id="h-out">退出登录</button></div>';
 h.innerHTML=o};
const load0=()=>load();
const show=()=>{editing=false;L=null;draw();$('#hub').hidden=false;document.body.style.overflow='hidden';try{sessionStorage.removeItem('hub-in')}catch(e){}};
window.__showHub=show;
const enter=()=>{$('#hub').hidden=true;document.body.style.overflow='';try{sessionStorage.setItem('hub-in','1')}catch(e){}};
document.addEventListener('click',async e=>{
 const h=$('#hub');if(!h||h.hidden){const t=e.target.closest('#tb-home');if(t){e.preventDefault();show()}
  if(e.target.closest('#lgo')||e.target.closest('#lg-f button')){try{sessionStorage.removeItem('hub-in')}catch(x){}}return}
 if(e.target.closest('#h-go')){enter();return}
 if(e.target.closest('#h-out')){try{sessionStorage.removeItem('hub-in')}catch(x){}const o=$('#lgo');enter();if(o)o.click();return}
 if(e.target.closest('[data-edit]')){editing=true;draw();return}
 if(e.target.closest('#h-ed')){if(editing){const t=$('#h-t');if(t)L.title=t.value.trim()||'我的生意';h.querySelectorAll('input.n').forEach(x=>L.items[+x.dataset.i].n=x.value.trim());h.querySelectorAll('input.u').forEach(x=>L.items[+x.dataset.i].u=x.value.trim());editing=false;draw();await save()}else{editing=true;draw()}return}
});
const ensureHome=()=>{const tb=$('#tabs');if(!tb||window.__ROLE!=='admin'||tb.querySelector('#tb-home'))return;const b=document.createElement('button');b.id='tb-home';b.className='tb';b.type='button';b.textContent='主页';b.setAttribute('aria-label','主页');tb.prepend(b)};
const boot=()=>{if(window.__ROLE!=='admin'){const h=$('#hub');if(h)h.hidden=true;return}
 let seen=false;try{seen=sessionStorage.getItem('hub-in')==='1'}catch(e){}
 const tb=$('#tabs');if(tb)new MutationObserver(ensureHome).observe(tb,{childList:true});ensureHome();
 if(!seen)show();else $('#hub').hidden=true};
const wait=()=>{let n=0;const hubEl=$('#hub');
 let seen0=false;try{seen0=sessionStorage.getItem('hub-in')==='1'}catch(e){}
 if(!seen0&&hubEl)hubEl.hidden=false;
 const tick=()=>{n++;const lg=$('#login');
  if(window.__ROLE){boot();return}
  if((lg&&!lg.hidden)||n>150){if(hubEl)hubEl.hidden=true;return}
  setTimeout(tick,60)};tick()};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',wait);else wait();
}catch(e){console.error(e)}})();

<script>/* hub fx */
(function(){try{
const h=document.getElementById('hub');if(!h)return;
let drawn=false;
const stagger=()=>{const hb=h.querySelector('.hb');if(!hb)return;[...hb.children].forEach((c,i)=>c.style.setProperty('--i',i));h.classList.toggle('again',drawn);drawn=true};
new MutationObserver(stagger).observe(h,{childList:true});
h.addEventListener('pointerdown',e=>{const b=e.target.closest('.hbtn');if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2.2,x=document.createElement('span');x.className='rip';x.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';b.appendChild(x);setTimeout(()=>x.remove(),650)});
// animated exit: intercept hiding via class
const hide=Object.getOwnPropertyDescriptor(HTMLElement.prototype,'hidden');
let busy=false;
Object.defineProperty(h,'hidden',{configurable:true,get(){return hide.get.call(h)},set(v){
 if(v&&!hide.get.call(h)&&document.getElementById('app')&&!busy&&h.dataset.fx==='1'){busy=true;h.classList.add('out');document.body.classList.add('led-in');setTimeout(()=>{hide.set.call(h,true);h.classList.remove('out');document.body.style.overflow='';busy=false;setTimeout(()=>document.body.classList.remove('led-in'),700)},420)}
 else{if(!v){h.classList.remove('out');drawn=false}hide.set.call(h,v)}}});
h.dataset.fx='1';
}catch(e){console.error(e)}})();
</script>

<script>/* my-business 3D floating button */
(function(){try{
const $=s=>document.querySelector(s),biz=$('#biz'),btn=$('#bz-btn'),panel=$('#bz-panel');if(!biz)return;
const ESC=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=u=>{u=(u||'').trim();if(!u)return'';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;try{const p=new URL(u);return(p.protocol==='http:'||p.protocol==='https:')?p.href:''}catch(e){return''}};
const links=()=>{let v=window.__LINKS;if(!v){try{v=JSON.parse(localStorage.getItem('hub-links')||'null')}catch(e){}}return((v&&v.items)||[]).slice(0,3).filter(x=>x&&(x.n||x.u))};
const ICO={link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',re:'<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>'};
const svg=k=>'<svg viewBox="0 0 24 24">'+ICO[k]+'</svg>';
const build=()=>{const L=links();let o='';
 L.forEach(x=>{const u=norm(x.u);o+='<a class="bz-item" '+(u?'href="'+ESC(u)+'" target="_blank" rel="noopener noreferrer"':'')+'><span class="ic">'+svg('link')+'</span><span class="tx">'+ESC(x.n||x.u)+'</span></a>'});
 if(!L.length)o+='<div class="bz-item sub" style="opacity:1;transform:none">还没有链接，请先到主页添加</div>';
 panel.innerHTML=o;[...panel.children].reverse().forEach((c,i)=>c.style.setProperty('--i',i))};
const spark=(x,y,n)=>{for(let i=0;i<(n||10);i++){const s=document.createElement('i');s.className='bz-spark';const a=Math.random()*6.283,d=30+Math.random()*50;s.style.cssText='left:'+x+'px;top:'+y+'px;--dx:'+Math.cos(a)*d+'px;--dy:'+Math.sin(a)*d+'px';biz.appendChild(s);setTimeout(()=>s.remove(),750)}};
const ripple=(el,e)=>{const r=el.getBoundingClientRect(),s=Math.max(r.width,r.height)*2.2,x=document.createElement('span');x.className='bz-rip';x.style.cssText='width:'+s+'px;height:'+s+'px;left:'+((e.clientX||r.left+r.width/2)-r.left-s/2)+'px;top:'+((e.clientY||r.top+r.height/2)-r.top-s/2)+'px';el.appendChild(x);setTimeout(()=>x.remove(),650)};
const open=()=>{build();biz.classList.add('open');btn.setAttribute('aria-expanded','true')};
const close=()=>{biz.classList.remove('open');btn.setAttribute('aria-expanded','false')};
const replay=()=>{biz.classList.remove('open');void panel.offsetWidth;setTimeout(open,60)};
btn.addEventListener('pointerdown',e=>{btn.classList.add('press');spark(e.clientX,e.clientY,8)});
['pointerup','pointerleave','pointercancel'].forEach(t=>btn.addEventListener(t,()=>btn.classList.remove('press')));
btn.addEventListener('click',()=>{biz.classList.contains('open')?close():open()});
panel.addEventListener('pointerdown',e=>{const it=e.target.closest('.bz-item');if(it){ripple(it,e);spark(e.clientX,e.clientY,10)}});
panel.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){e.preventDefault();if(b.dataset.act==='replay')replay();else{close();const h=document.getElementById('tb-home');if(h){h.click();setTimeout(()=>{const ed=document.getElementById('h-ed');if(ed)ed.click()},500)}}return}
 if(e.target.closest('a.bz-item'))setTimeout(close,250)});
biz.querySelector('.bz-scrim').addEventListener('click',close);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&biz.classList.contains('open')){e.stopImmediatePropagation();close()}},true);
const sync=()=>{const hub=document.getElementById('hub'),login=document.getElementById('login');const show=window.__ROLE==='admin'&&hub&&hub.hidden&&!(login&&!login.hidden)&&matchMedia('(max-width:700px)').matches;biz.classList.toggle('on',!!show);if(!show)close()};
setInterval(sync,400);sync();
}catch(e){console.error(e)}})();
</script>
